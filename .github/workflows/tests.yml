name: Run Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]



jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.14"]

    env:
      # Tests run entirely against TEST_DATABASE_URL (see test/utils.py), but
      # app/extensions.py builds the app's own engine from DATABASE_URL at
      # import time regardless, so it still has to be a valid URL even
      # though nothing here ever connects with it.
      DATABASE_URL: "sqlite:///./ci.db"
      TEST_DATABASE_URL: "sqlite:///./ci_test.db"

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set Up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download NLTK tokenizer data
        run: python -m nltk.downloader punkt punkt_tab

      - name: Run tests
        run: pytest -v