services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: author_attribution
      POSTGRES_PASSWORD: author_attribution
      POSTGRES_DB: author_attribution
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U author_attribution"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://author_attribution:author_attribution@db:5432/author_attribution
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
